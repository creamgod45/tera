# 定界符错误
error.unclosed.delimiter=未闭合的 ''{0}''：缺少 ''{1}''

# 块结构错误
error.unclosed.block=未闭合的 ''{0}'' 块：缺少结束标签（end{0}）
error.unexpected.closer=意外的 ''{0}''：没有对应的 ''{1}'' 块
error.block.mismatch=''{0}'' 与已打开的 ''{1}'' 块不匹配（应为 end{1}）
error.middle.outside.if=''{0}'' 必须在 if 块内使用

# 标签内容错误
error.tag.invalid.start=标签必须以关键字开头，此处为 ''{0}''
error.tag.invalid.name=''{0}'' 不是合法的标签名
error.tag.no.args=''{0}'' 不接受任何参数
error.tag.optional.name=''{0}'' 只接受一个可选名称
error.condition.missing=''{0}'' 需要一个条件表达式
error.for.missing.all=''for'' 需要循环变量和 ''in'' 关键字
error.for.missing.variable=''in'' 前缺少循环变量名
error.for.missing.in=''for'' 缺少 ''in'' 关键字

# 点号错误
error.double.dot=无效的 ''..''：是否应为 ''.''？
error.dangling.dot=''.'' 后需要属性名或索引

# 宏 / import 检查
semantic.macro.duplicate=宏 ''{0}'' 已在此模板中定义
semantic.param.duplicate=参数 ''{0}'' 重复
semantic.import.unresolved=无法解析模板 ''{0}''
semantic.namespace.unknown=未知的宏命名空间 ''{0}''：请添加使用 ''as {0}'' 的 import 标签
semantic.macro.undefined.self=此模板中未定义宏 ''{0}''
semantic.macro.undefined.in=''{1}'' 中未定义宏 ''{0}''
semantic.arg.positional=宏调用只接受关键字参数（name=value）
semantic.arg.unknown=宏 ''{0}'' 没有参数 ''{1}''
semantic.arg.duplicate=参数 ''{0}'' 被重复传递
semantic.arg.missing=宏 ''{0}'' 缺少必需参数：{1}
