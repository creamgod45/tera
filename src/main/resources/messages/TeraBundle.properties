# Delimiter errors
error.unclosed.delimiter=Unclosed ''{0}'': missing ''{1}''

# Block structure errors
error.unclosed.block=Unclosed ''{0}'' block: missing end tag (end{0})
error.unexpected.closer=Unexpected ''{0}'': no open ''{1}'' block
error.block.mismatch=''{0}'' does not match open ''{1}'' block (expected end{1})
error.middle.outside.if=''{0}'' must be inside an if block

# Tag content errors
error.tag.invalid.start=Tag must start with a keyword, found ''{0}''
error.tag.invalid.name=''{0}'' is not a valid tag name
error.tag.no.args=''{0}'' takes no arguments
error.tag.optional.name=''{0}'' accepts only an optional name
error.condition.missing=''{0}'' requires a condition expression
error.for.missing.all=''for'' requires a loop variable and ''in'' keyword
error.for.missing.variable=Missing loop variable before ''in''
error.for.missing.in=''for'' is missing ''in'' keyword

# Dot operator errors
error.double.dot=Invalid token ''..'': did you mean ''.''?
error.dangling.dot=Expected a property name or index after ''.''

# Macro / import checks
semantic.macro.duplicate=Macro ''{0}'' is already defined in this template
semantic.param.duplicate=Duplicate parameter ''{0}''
semantic.import.unresolved=Cannot resolve template ''{0}''
semantic.namespace.unknown=Unknown macro namespace ''{0}'': add an import tag using ''as {0}''
semantic.macro.undefined.self=Macro ''{0}'' is not defined in this template
semantic.macro.undefined.in=Macro ''{0}'' is not defined in ''{1}''
semantic.arg.positional=Macro calls accept keyword arguments only (name=value)
semantic.arg.unknown=Macro ''{0}'' has no parameter ''{1}''
semantic.arg.duplicate=Argument ''{0}'' is passed more than once
semantic.arg.missing=Macro ''{0}'' is missing required argument(s): {1}

# Render context checks
semantic.var.undefined=Variable ''{0}'' is not defined in this template or in the Rust render context
semantic.var.undefined.macro=Macros cannot read the render context; pass ''{0}'' as an argument
semantic.field.missing=Field ''{0}'' does not exist on ''{1}''
