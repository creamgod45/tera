[package]
name = "verify-migration"
version = "0.1.0"
edition = "2021"
publish = false

# Not part of any workspace above this directory.
[workspace]

[dependencies]
# Both engines side by side, to render the same templates before and after the migration.
tera1 = { package = "tera", version = "=1.20.1", features = ["preserve_order"] }
tera2 = { package = "tera", version = "=2.4.0", features = ["preserve_order"] }
serde_json = { version = "1", features = ["preserve_order"] }
