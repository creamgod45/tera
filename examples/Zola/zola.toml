# The URL the site will be built for
base_url = "https://bltn.cc"
title = "bltn.cc"
description = "Notes on Rust, templates and the tools around them."

generate_feeds = true
feed_filenames = ["atom.xml"]

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

taxonomies = [
    { name = "tags", feed = true, paginate_by = 8 },
    { name = "categories", paginate_by = 8 },
]

[markdown]
smart_punctuation = true
insert_anchor_links = "heading"

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here
author = "Ken Wang"
tagline = "寫 Rust、調模板、整理筆記。"
github = "https://github.com/creamgod45"
nav = [
    { name = "Blog", url = "@/blog/_index.md" },
    { name = "Projects", url = "@/projects/_index.md" },
    { name = "About", url = "@/about.md" },
]
