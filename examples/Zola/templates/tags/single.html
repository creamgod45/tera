{% extends "base.html" %}
{% block title %}#{{ term.name }} · {{ config.title }}{% endblock title %}
{% block content %}
<header class="page-head">
  <p class="eyebrow">標籤</p>
  <h1>#{{ term.name }}</h1>
  <p class="lead">{{ term.pages | length }} 篇文章</p>
</header>
<div class="list">
  {% for page in paginator.pages %}{{ <post_card page={page}/> }}{% endfor %}
</div>
{{ <pager paginator={paginator}/> }}
{% endblock content %}
